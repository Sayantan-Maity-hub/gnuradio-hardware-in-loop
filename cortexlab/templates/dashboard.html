<!DOCTYPE html>
<html>
<head>
    <title>CortexLab Controller</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f6f8fa;
        }
        h2{
            margin-bottom: 5px;
        }
        .container{
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card{
            background: white;
            padding: 15px;
            border-radius:10px;
            width: 260px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);

        }
        .online{
            color: green;
            font-weight: bold;
        }
        .offline{
            color: red;
            font-weight: bold;

        }
        .job-box{
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1)


        }
        input{
            padding: 8px;
            margin: 5px;
            width: 200px

        }
        button {
            padding: 8px 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h2>CortexLab Node Dashboard</h2>

<p>Updates automatically every 2 seconds.</p>

<div class="container" id="nodes"></div>
<!--JOB CONTROL PANEL-->
<div class="job-box">
    <h3>Run Job on Node</h3>
    <select id="nodeSelect"></select>
    <input id="script" placeholder="/tmp/basic_test.sh" />
    <button onclick="startJob()">Start Job</button>
    <p id="jobStatus"></p>

</div>

<script>
const API = "http://127.0.0.1:5678/status/nodes";

async function updateNodes() {
    try {
        const response = await fetch(API);
        const data = await response.json();

        const container = document.getElementById("nodes")
        container.innerHTML = ""
        for (const [node, info] of Object.entries(data)){
            const statusClass = info.status === "ONLINE" ? "online" : "offline";
            container.innerHTML += `
                <div class="card">
                    <h3>${node}</h3>
                    <p><b>Hostname:</b> ${info.hostname}</p>
                    <p><b>Status:</b> <span class = "${statusClass}">${info.status}</span></p>
                    <p><b>OS:</b> ${info.os || "N/A"}</p>
                    <p><b>Job:</b> ${info.job?.state || "IDLE"}</p>
                </div>
            `;    
        }
    
    }
    catch(err) {
        document.getElementById("nodes").innerHTML =
            "<p style = 'color:red'>Failed to load nodes.";
    }
}
async function loadNodesIntoDropdown() {

    try{
        const res = await fetch(API);
        const data = await res.json();
        const select = document.getElementById("nodeSelect");
        select.innerHTML = "";

        for (const node of Object.keys(data)){
            const option = document.createElement("option")
            option.value = node;
            option.textContent = node;
            select.appendChild(option);
        }

    }catch (err) {
        console.log("Failed to load nodes for dropdown");
    }
    
}
function startJob(){
    const node = document.getElementById("nodeSelect").value;
    const script = document.getElementById("script").value;

    fetch("http://127.0.0.1:5678/control/job/start", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            node: node,
            script: script
        })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("jobStatus").innerText= "Job started on " + data.node;
        watchJob(data.node);
    })
    .catch(() => {
        document.getElementById("jobStatus").innerText= "Failed to start job";
    });

}
async function watchJob(node) {
    const timer = setInterval(async () => {
        const res = await fetch(`http://127.0.0.1:5678/status/job/${node}`);
        const job = await res.json();

        document.getElementById("jobStatus").innerText=`${node} --> ${job.state}`;
        if (job.state === "FINISHED") {
            clearInterval(timer)
            let result = "UNKNOWN";
            if (job.step && job.step.length > 0){
                result = job.step[0].result;
            }
            document.getElementById("jobStatus").innerText=`${node} --> FINISHED | Result: ${result}`;
            console.log("Steps:", job.step);
        }
    }, 2000);
    
}

updateNodes();
loadNodesIntoDropdown();

setInterval(() => {updateNodes(); loadNodesIntoDropdown();}, 2000);
</script>

</body>
</html>
