<!DOCTYPE html>
<html>
<head>
    <title>CortexLab Dashboard</title>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body>

<h1>CortexLab Nodes</h1>

<div id="nodes"></div>

<script>

const socket = io("http://localhost:5678");

socket.on("connect", () => {
    console.log("Connected");
});

socket.on("node_update", (msg) => {

    const node = msg.node;
    const data = msg.data;

    let card = document.getElementById(node);

    if (!card) {
        card = document.createElement("div");
        card.id = node;
        card.style.border = "1px solid black";
        card.style.padding = "10px";
        card.style.margin = "10px";

        document.getElementById("nodes").appendChild(card);
    }

    card.innerHTML = `
        <h3>${node}</h3>
        <p>Hostname: ${data.hostname}</p>
        <p>Status: ${data.status}</p>
        <p>OS: ${data.os}</p>
    `;
});

</script>

</body>
</html>
